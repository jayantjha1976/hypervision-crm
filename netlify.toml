# The website is the "public" folder; the server jobs are in netlify/functions.
[build]
  publish = "public"
  command = "echo no build step"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "web-push"]

# Always check for the newest app files, so updates show without a hard refresh.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
